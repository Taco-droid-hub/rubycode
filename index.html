<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#F2F2F7">
    <title>Flaude</title>
    <style>
        :root {
            --blue: #007AFF;
            --blue-active: #0062CC;
            --green: #34C759;
            --red: #FF3B30;
            --gray: #8E8E93;
            --gray2: #AEAEB2;
            --gray3: #C7C7CC;
            --gray4: #D1D1D6;
            --gray5: #E5E5EA;
            --gray6: #F2F2F7;
            --bg-primary: #F2F2F7;
            --bg-secondary: #FFFFFF;
            --label: #000000;
            --secondary-label: rgba(60,60,67,0.6);
            --tertiary-label: rgba(60,60,67,0.3);
            --separator: rgba(60,60,67,0.29);
            --fill-primary: rgba(120,120,128,0.2);
            --fill-secondary: rgba(120,120,128,0.16);
            --fill-tertiary: rgba(120,120,128,0.12);
            --header-height: 56px;
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Arial', sans-serif;
        }
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body { height:100%; width:100%; overflow:hidden; font-family:var(--font); font-size:17px; line-height:1.35; color:var(--label); background:var(--bg-primary); -webkit-font-smoothing:antialiased; }
        a { color:var(--blue); text-decoration:none; }
        .app { display:flex; flex-direction:column; height:100%; height:100dvh; width:100%; max-width:480px; margin:0 auto; position:relative; background:var(--bg-primary); }

        /* Header */
        .header { position:relative; flex-shrink:0; height:var(--header-height); padding-top:var(--safe-area-top); z-index:100; }
        .header-blur { position:absolute; inset:0; background:rgba(249,249,249,0.94); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); z-index:-1; }
        .header-border { position:absolute; bottom:0; left:0; right:0; height:0.33px; background:var(--separator); }
        .header-content { display:flex; align-items:center; justify-content:space-between; height:100%; padding:0 16px; }
        .header-left { display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
        .bot-avatar-sm { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }
        .bot-avatar-sm svg { width:18px; height:18px; }
        .header-text { display:flex; flex-direction:column; min-width:0; }
        .header-title { font-size:17px; font-weight:600; line-height:1.2; letter-spacing:-0.2px; }
        .header-model { font-size:13px; color:var(--secondary-label); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px; line-height:1.3; }
        .icon-btn { width:34px; height:34px; border-radius:50%; border:none; background:none; color:var(--blue); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s; }
        .icon-btn svg { width:22px; height:22px; }
        .icon-btn:hover { background:var(--fill-tertiary); }
        .icon-btn:active { background:var(--fill-primary); transform:scale(0.94); }

        /* Chat Area */
        .chat-area { flex:1; overflow:hidden; position:relative; }
        .scroll-wrapper { height:100%; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
        .scroll-wrapper::-webkit-scrollbar { display:none; }
        .messages-container { min-height:100%; display:flex; flex-direction:column; padding:8px 16px; }

        /* Welcome */
        .welcome { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; padding:40px 24px; text-align:center; gap:10px; }
        .welcome.hidden { display:none; }
        .welcome-icon { width:80px; height:80px; border-radius:22px; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 8px 24px rgba(102,126,234,0.35); margin-bottom:8px; }
        .welcome-icon svg { width:40px; height:40px; }
        .welcome h2 { font-size:28px; font-weight:700; letter-spacing:-0.5px; }
        .welcome p { font-size:15px; color:var(--secondary-label); max-width:280px; line-height:1.4; }
        .welcome .hint { font-size:13px; color:var(--tertiary-label); margin-top:4px; }
        .welcome-btn { margin-top:20px; display:inline-flex; align-items:center; gap:8px; background:var(--blue); color:#fff; border:none; border-radius:14px; padding:14px 28px; font-family:var(--font); font-size:17px; font-weight:600; cursor:pointer; transition:background .15s, transform .15s; }
        .welcome-btn svg { width:20px; height:20px; }
        .welcome-btn:hover { background:var(--blue-active); }
        .welcome-btn:active { transform:scale(0.96); }

        /* Messages */
        .msg-group { display:flex; flex-direction:column; margin-bottom:6px; }
        .msg-group.sent { align-items:flex-end; }
        .msg-group.received { align-items:flex-start; }
        .msg-row { display:flex; align-items:flex-end; gap:6px; max-width:85%; }
        .msg-group.sent .msg-row { flex-direction:row-reverse; }
        .msg-avatar { width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; align-self:flex-end; }
        .msg-avatar svg { width:14px; height:14px; }
        .msg-avatar.hide { visibility:hidden; }
        .msg-bubble { padding:9px 14px; font-size:17px; line-height:1.35; word-wrap:break-word; overflow-wrap:break-word; animation:msgIn .25s ease-out; }
        .msg-group.sent .msg-bubble { background:var(--blue); color:#fff; border-radius:18px 18px 4px 18px; }
        .msg-group.sent .msg-bubble.tail-last { border-radius:18px 4px 4px 18px; }
        .msg-group.sent .msg-bubble.tail-single { border-radius:18px 18px 4px 18px; }
        .msg-group.received .msg-bubble { background:#E9E9EB; color:#000; border-radius:18px 18px 18px 4px; }
        .msg-group.received .msg-bubble.tail-last { border-radius:18px 4px 18px 4px; }
        .msg-group.received .msg-bubble.tail-single { border-radius:18px 18px 18px 4px; }
        .msg-bubble p { margin:0; }
        .msg-bubble p+p { margin-top:8px; }
        .msg-bubble code { font-family:'SF Mono',Menlo,Monaco,'Courier New',monospace; font-size:.9em; background:rgba(0,0,0,.08); padding:1px 5px; border-radius:4px; }
        .msg-group.sent .msg-bubble code { background:rgba(255,255,255,.2); }
        .msg-bubble pre { margin:8px 0 4px; padding:10px 12px; border-radius:10px; overflow-x:auto; font-size:14px; line-height:1.4; }
        .msg-group.received .msg-bubble pre { background:rgba(0,0,0,.06); }
        .msg-group.sent .msg-bubble pre { background:rgba(255,255,255,.15); }
        .msg-bubble pre code { background:none; padding:0; font-size:inherit; }
        .msg-bubble strong { font-weight:600; }
        .msg-bubble em { font-style:italic; }
        .msg-bubble ul, .msg-bubble ol { padding-left:20px; margin:6px 0; }
        .msg-bubble li { margin:2px 0; }
        .msg-bubble blockquote { border-left:3px solid var(--gray3); padding-left:10px; margin:6px 0; color:var(--secondary-label); }
        .msg-group.sent .msg-bubble blockquote { border-left-color:rgba(255,255,255,.4); color:rgba(255,255,255,.8); }

        /* Typing */
        .typing { display:flex; align-items:center; gap:4px; padding:12px 16px; }
        .typing-dot { width:8px; height:8px; border-radius:50%; background:var(--gray3); animation:bounce 1.4s infinite ease-in-out; }
        .typing-dot:nth-child(1) { animation-delay:0s; }
        .typing-dot:nth-child(2) { animation-delay:.2s; }
        .typing-dot:nth-child(3) { animation-delay:.4s; }
        @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-6px);opacity:1} }
        @keyframes msgIn { from{opacity:0;transform:translateY(8px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }

        /* System message */
        .sys-msg { text-align:center; font-size:13px; color:var(--gray); padding:8px 0; animation:msgIn .25s ease-out; }

        /* Error */
        .err-msg { font-size:13px; color:var(--red); padding:4px 8px; margin-top:2px; animation:msgIn .25s ease-out; }

        /* Input Bar */
        .input-bar { flex-shrink:0; position:relative; padding-bottom:var(--safe-area-bottom); z-index:100; background:var(--bg-secondary); }
        .input-bar-blur { position:absolute; inset:0; background:rgba(255,255,255,.94); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); z-index:-1; }
        .input-bar-border { position:absolute; top:0; left:0; right:0; height:0.33px; background:var(--separator); }
        .input-container { display:flex; align-items:flex-end; gap:8px; padding:6px 12px 8px; }
        .input-wrapper { flex:1; min-height:36px; max-height:120px; display:flex; align-items:center; background:var(--fill-tertiary); border-radius:20px; padding:0 14px; border:.5px solid transparent; transition:border-color .2s, background .2s; }
        .input-wrapper:focus-within { border-color:var(--gray4); background:var(--bg-secondary); }
        #msg-input { flex:1; border:none; outline:none; background:none; font-family:var(--font); font-size:17px; line-height:1.3; color:var(--label); padding:8px 0; resize:none; max-height:104px; overflow-y:auto; scrollbar-width:none; }
        #msg-input::-webkit-scrollbar { display:none; }
        #msg-input::placeholder { color:var(--tertiary-label); }
        .send-btn { width:36px; height:36px; border-radius:50%; border:none; background:var(--blue); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform .15s, opacity .15s, background .15s; margin-bottom:2px; }
        .send-btn svg { width:20px; height:20px; }
        .send-btn:disabled { background:var(--gray4); color:var(--gray); cursor:default; }
        .send-btn:not(:disabled):hover { background:var(--blue-active); }
        .send-btn:not(:disabled):active { transform:scale(.88); }

        /* Bottom Sheet */
        .overlay { position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:200; opacity:1; transition:opacity .3s; }
        .overlay.hidden { opacity:0; pointer-events:none; }
        .sheet { position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; background:var(--bg-secondary); border-radius:14px 14px 0 0; z-index:201; transform:translateY(0); transition:transform .35s cubic-bezier(.32,.72,0,1); padding-bottom:var(--safe-area-bottom); max-height:70vh; overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
        .sheet.hidden { transform:translateY(100%); }
        .sheet::-webkit-scrollbar { display:none; }
        .sheet-handle-bar { display:flex; justify-content:center; padding:6px 0 0; position:sticky; top:0; background:var(--bg-secondary); z-index:1; }
        .sheet-handle { width:36px; height:5px; border-radius:100px; background:var(--gray4); }
        .sheet-header { display:flex; align-items:center; justify-content:space-between; padding:10px 20px 4px; position:sticky; top:11px; background:var(--bg-secondary); z-index:1; }
        .sheet-header h3 { font-size:17px; font-weight:600; letter-spacing:-0.2px; }
        .sheet-close { color:var(--gray) !important; }
        .sheet-body { padding:8px 20px 24px; }
        .input-group { margin-bottom:16px; }
        .input-group label { display:block; font-size:13px; font-weight:500; color:var(--secondary-label); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
        .input-group input { width:100%; padding:12px 14px; border:none; border-radius:12px; background:var(--fill-tertiary); font-family:var(--font); font-size:17px; color:var(--label); outline:none; transition:background .15s, box-shadow .15s; }
        .input-group input:focus { background:var(--bg-secondary); box-shadow:0 0 0 3px rgba(0,122,255,.3); }
        .input-group input::placeholder { color:var(--tertiary-label); }
        .sheet-btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; background:var(--blue); color:#fff; border:none; border-radius:12px; padding:14px; font-family:var(--font); font-size:17px; font-weight:600; cursor:pointer; transition:background .15s, transform .15s; }
        .sheet-btn svg { width:20px; height:20px; }
        .sheet-btn:hover { background:var(--blue-active); }
        .sheet-btn:active { transform:scale(.96); }
        .sheet-hint { font-size:13px; color:var(--secondary-label); line-height:1.4; margin-top:10px; }
        .danger-btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; background:var(--fill-secondary); color:var(--red); border:none; border-radius:12px; padding:14px; font-family:var(--font); font-size:17px; font-weight:600; cursor:pointer; transition:background .15s, transform .15s; margin-top:10px; }
        .danger-btn svg { width:20px; height:20px; }
        .danger-btn:hover { background:var(--fill-primary); }
        .danger-btn:active { transform:scale(.96); }

        /* Toast */
        .toast { position:fixed; top:60px; left:50%; transform:translateX(-50%) translateY(0); z-index:300; background:rgba(0,0,0,.75); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); color:#fff; border-radius:12px; padding:12px 18px; font-size:15px; font-weight:500; transition:opacity .3s, transform .3s; pointer-events:none; white-space:nowrap; }
        .toast.hidden { opacity:0; transform:translateX(-50%) translateY(-16px); }
        .toast-inner { display:flex; align-items:center; gap:8px; }

        @media(min-width:481px) {
            .app { border-left:.33px solid var(--separator); border-right:.33px solid var(--separator); }
            .sheet { left:calc(50% - 240px); right:calc(50% - 240px); width:480px; }
            .toast { left:calc(50% - 240px); transform:translateX(0) translateY(0); }
            .toast.hidden { transform:translateX(0) translateY(-16px); }
        }
        ::selection { background:rgba(0,122,255,.25); }
        .spacer { flex:1; min-height:20px; }
    </style>
</head>
<body>
<div class="app" id="app">
    <!-- Header -->
    <header class="header">
        <div class="header-blur"></div>
        <div class="header-content">
            <div class="header-left">
                <div class="bot-avatar-sm">
                    <i data-lucide="sparkles"></i>
                </div>
                <div class="header-text">
                    <h1>Flaude</h1>
                    <span class="header-model" id="hdr-model">anthropic/claude-3.5-sonnet</span>
                </div>
            </div>
            <button class="icon-btn" id="settings-btn" aria-label="Settings">
                <i data-lucide="settings"></i>
            </button>
        </div>
        <div class="header-border"></div>
    </header>

    <!-- Chat -->
    <main class="chat-area">
        <div class="scroll-wrapper" id="scroll">
            <div class="messages-container" id="msgs">
                <div class="welcome" id="welcome">
                    <div class="welcome-icon"><i data-lucide="sparkles"></i></div>
                    <h2>Flaude</h2>
                    <p>Your AI assistant powered by OpenRouter</p>
                    <p class="hint">Ketik <strong>/model</strong> di chat untuk ganti model</p>
                    <button class="welcome-btn" id="setup-btn">
                        <i data-lucide="key"></i>
                        <span>Set API Key</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Input -->
    <footer class="input-bar">
        <div class="input-bar-blur"></div>
        <div class="input-bar-border"></div>
        <div class="input-container">
            <div class="input-wrapper">
                <textarea id="msg-input" placeholder="Message" rows="1" enterkeyhint="send"></textarea>
            </div>
            <button class="send-btn" id="send-btn" disabled aria-label="Send">
                <i data-lucide="arrow-up"></i>
            </button>
        </div>
    </footer>
</div>

<!-- Settings Sheet -->
<div class="overlay hidden" id="s-overlay"></div>
<div class="sheet hidden" id="s-sheet">
    <div class="sheet-handle-bar"><div class="sheet-handle"></div></div>
    <div class="sheet-header">
        <h3>Settings</h3>
        <button class="icon-btn sheet-close" id="s-close" aria-label="Close"><i data-lucide="x"></i></button>
    </div>
    <div class="sheet-body">
        <div class="input-group">
            <label for="key-input">OpenRouter API Key</label>
            <input type="password" id="key-input" placeholder="sk-or-v1-..." autocomplete="off">
        </div>
        <p class="sheet-hint">Dapatkan API key di <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a></p>
        <button class="sheet-btn" id="save-key-btn"><i data-lucide="check"></i><span>Save</span></button>
        <button class="danger-btn" id="clear-btn"><i data-lucide="trash-2"></i><span>Clear Chat</span></button>
    </div>
</div>

<!-- Toast -->
<div class="toast hidden" id="toast">
    <div class="toast-inner">
        <i data-lucide="check-circle" id="toast-ico" style="width:20px;height:20px;flex-shrink:0;"></i>
        <span id="toast-msg">Saved</span>
    </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>
(function(){
'use strict';

const KEY = 'flaude_s';
let S = { apiKey:'', model:'tencent/hy3:free', msgs:[] };
let streaming = false, abort = null;

const $ = s => document.querySelector(s);
const welcome = $('#welcome'), msgs = $('#msgs'), scroll = $('#scroll');
const input = $('#msg-input'), sendBtn = $('#send-btn'), hdrModel = $('#hdr-model');
const sOverlay = $('#s-overlay'), sSheet = $('#s-sheet'), sClose = $('#s-close');
const keyInput = $('#key-input'), saveKeyBtn = $('#save-key-btn'), clearBtn = $('#clear-btn');
const setupBtn = $('#setup-btn'), settingsBtn = $('#settings-btn');
const toastEl = $('#toast'), toastMsg = $('#toast-msg'), toastIco = $('#toast-ico');

/* Persistence */
function load(){ try{ const r=localStorage.getItem(KEY); if(r) S={...S,...JSON.parse(r)}; }catch(e){} }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

/* Toast */
let tt=null;
function toast(msg,ok=true){
    if(tt) clearTimeout(tt);
    toastMsg.textContent=msg;
    toastIco.setAttribute('data-lucide', ok?'check-circle':'alert-circle');
    lucide.createIcons({nodes:[toastIco]});
    toastEl.className='toast'+(ok?'':' err');
    requestAnimationFrame(()=>toastEl.classList.remove('hidden'));
    tt=setTimeout(()=>toastEl.classList.add('hidden'),2200);
}

/* Sheets */
function openSheet(sheet,ov){ ov.classList.remove('hidden'); sheet.classList.remove('hidden'); void sheet.offsetHeight; }
function closeSheet(sheet,ov){ sheet.style.transform='translateY(100%)'; setTimeout(()=>{sheet.classList.add('hidden');sheet.style.transform='';ov.classList.add('hidden');},350); }

function openSettings(){ keyInput.value=S.apiKey; openSheet(sSheet,sOverlay); }
function closeSettings(){ closeSheet(sSheet,sOverlay); }

/* UI */
function updateUI(){
    hdrModel.textContent = S.model || 'No model';
    welcome.classList.toggle('hidden', !!S.apiKey);
    sendBtn.disabled = !input.value.trim() || streaming;
}

/* Resize textarea */
function resize(){
    input.style.height='auto';
    input.style.height=Math.min(input.scrollHeight,104)+'px';
    updateUI();
}

/* Scroll */
function toBottom(force){
    requestAnimationFrame(()=>{
        if(force || scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 150)
            scroll.scrollTop = scroll.scrollHeight;
    });
}

/* Markdown */
function md(t){
    if(!t) return '';
    let h = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    h = h.replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,c)=>'<pre><code>'+c.trim()+'</code></pre>');
    h = h.replace(/`([^`]+)`/g,'<code>$1</code>');
    h = h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    h = h.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g,'<em>$1</em>');
    h = h.replace(/^&gt;\s?(.+)$/gm,'<blockquote>$1</blockquote>');
    h = h.replace(/^[\-\*]\s+(.+)$/gm,'<li>$1</li>');
    h = h.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');
    h = h.replace(/\n\n+/g,'</p><p>');
    h = h.replace(/\n/g,'<br>');
    if(!h.startsWith('<pre>')&&!h.startsWith('<ul>')&&!h.startsWith('<blockquote>')) h='<p>'+h+'</p>';
    h = h.replace(/<p><\/p>/g,'');
    return h;
}

/* Avatar SVG inline */
const botSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>';

/* Render all messages */
function renderAll(){
    msgs.querySelectorAll('.msg-group,.sys-msg,.spacer').forEach(e=>e.remove());
    if(!S.msgs.length && S.apiKey){
        const sp=document.createElement('div'); sp.className='spacer'; msgs.insertBefore(sp,welcome);
        return;
    }
    const groups=[]; let cur=null;
    S.msgs.forEach(m=>{
        if(!cur||cur.role!==m.role){ cur={role:m.role,items:[m]}; groups.push(cur); }
        else cur.items.push(m);
    });
    const frag=document.createDocumentFragment();
    groups.forEach(g=>{
        const wrap=document.createElement('div');
        wrap.className='msg-group '+(g.role==='user'?'sent':'received');
        g.items.forEach((m,i)=>{
            const row=document.createElement('div'); row.className='msg-row';
            if(g.role==='assistant'){
                const av=document.createElement('div');
                av.className='msg-avatar'+(i>0?' hide':'');
                av.innerHTML=botSVG;
                row.appendChild(av);
            }
            const bub=document.createElement('div');
            bub.className='msg-bubble';
            bub.innerHTML=md(m.content);
            const single=g.items.length===1, last=i===g.items.length-1;
            bub.classList.add(single?'tail-single':last?'tail-last':'');
            row.appendChild(bub);
            wrap.appendChild(row);
        });
        frag.appendChild(wrap);
    });
    msgs.insertBefore(frag,welcome);
}

/* Add user message to DOM */
function addUserDOM(content){
    const g=document.createElement('div'); g.className='msg-group sent';
    const r=document.createElement('div'); r.className='msg-row';
    const b=document.createElement('div'); b.className='msg-bubble tail-single';
    b.innerHTML=md(content); r.appendChild(b); g.appendChild(r);
    msgs.insertBefore(g,welcome); toBottom(true);
}

/* Add/update assistant message in DOM */
function updateAssistantDOM(content){
    const groups=msgs.querySelectorAll('.msg-group.received');
    if(groups.length>0){
        const last=groups[groups.length-1];
        const bubbles=last.querySelectorAll('.msg-bubble');
        if(bubbles.length>0){ bubbles[bubbles.length-1].innerHTML=md(content); toBottom(); return; }
    }
    const g=document.createElement('div'); g.className='msg-group received';
    const r=document.createElement('div'); r.className='msg-row';
    const av=document.createElement('div'); av.className='msg-avatar'; av.innerHTML=botSVG;
    const b=document.createElement('div'); b.className='msg-bubble tail-single'; b.innerHTML=md(content);
    r.appendChild(av); r.appendChild(b); g.appendChild(r);
    msgs.insertBefore(g,welcome); toBottom();
}

/* Typing indicator */
function showTyping(){
    const g=document.createElement('div'); g.className='msg-group received'; g.id='typing-g';
    const r=document.createElement('div'); r.className='msg-row';
    const av=document.createElement('div'); av.className='msg-avatar'; av.innerHTML=botSVG;
    const b=document.createElement('div'); b.className='msg-bubble tail-single';
    b.innerHTML='<div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
    r.appendChild(av); r.appendChild(b); g.appendChild(r);
    msgs.insertBefore(g,welcome); toBottom(true);
}
function hideTyping(){ const e=document.getElementById('typing-g'); if(e) e.remove(); }

/* System message */
function sysMsg(text){
    const el=document.createElement('div'); el.className='sys-msg'; el.textContent=text;
    msgs.insertBefore(el,welcome); toBottom(true);
}

/* Error */
function errMsg(text){
    const el=document.createElement('div'); el.className='err-msg'; el.textContent=text;
    msgs.insertBefore(el,welcome); toBottom(true);
    setTimeout(()=>el.remove(),8000);
}

/* Handle /model command */
function handleCommand(raw){
    const text = raw.trim();
    if(text.startsWith('/model')){
        const parts = text.split(/\s+/);
        const modelName = parts.slice(1).join(' ').trim();
        if(!modelName){
            sysMsg('Penggunaan: /model <model-id>\nContoh: /model anthropic/claude-3.5-sonnet');
            return true;
        }
        S.model = modelName;
        save();
        updateUI();
        sysMsg('Model diubah ke: ' + modelName);
        return true;
    }
    return false;
}

/* Send message */
async function send(){
    const text = input.value.trim();
    if(!text || streaming) return;
    if(!S.apiKey){ toast('Set API key dulu','error'); openSettings(); return; }

    // Check command
    if(handleCommand(text)){
        input.value=''; resize();
        return;
    }

    input.value=''; resize();

    S.msgs.push({role:'user',content:text});
    addUserDOM(text); save();

    streaming=true; updateUI(); showTyping();
    abort = new AbortController();

    try{
        const res = await fetch('https://openrouter.ai/api/v1/chat/completions',{
            method:'POST',
            headers:{
                'Authorization':'Bearer '+S.apiKey,
                'Content-Type':'application/json',
                'HTTP-Referer':location.href,
                'X-Title':'Flaude'
            },
            body:JSON.stringify({
                model:S.model,
                messages:S.msgs.map(m=>({role:m.role,content:m.content})),
                stream:true
            }),
            signal:abort.signal
        });

        if(!res.ok){
            const err = await res.json().catch(()=>({}));
            throw new Error(err.error?.message || 'API Error: '+res.status);
        }

        hideTyping();
        let full='';
        S.msgs.push({role:'assistant',content:''});
        updateAssistantDOM(''); toBottom(true);

        const reader=res.body.getReader(), dec=new TextDecoder();
        let buf='';
        while(true){
            const {done,value}=await reader.read();
            if(done) break;
            buf+=dec.decode(value,{stream:true});
            const lines=buf.split('\n'); buf=lines.pop()||'';
            for(const line of lines){
                const t=line.trim();
                if(!t||!t.startsWith('data: ')) continue;
                const d=t.slice(6);
                if(d==='[DONE]') continue;
                try{
                    const p=JSON.parse(d);
                    const c=p.choices?.[0]?.delta?.content;
                    if(c){ full+=c; S.msgs[S.msgs.length-1].content=full; updateAssistantDOM(full); }
                }catch(e){}
            }
        }
        if(full) save();
        else{ if(S.msgs.length&&S.msgs[S.msgs.length-1].content==='') S.msgs.pop(); errMsg('Tidak ada respons dari model.'); }
    }catch(e){
        hideTyping();
        if(e.name!=='AbortError'){ console.error(e); errMsg(e.message||'Gagal mendapat respons. Cek API key dan model.'); }
    }finally{
        streaming=false; abort=null; updateUI(); toBottom(true);
    }
}

/* Events */
sendBtn.addEventListener('click', send);
input.addEventListener('input', resize);
input.addEventListener('keydown', e=>{
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); send(); }
});
settingsBtn.addEventListener('click', openSettings);
sClose.addEventListener('click', closeSettings);
sOverlay.addEventListener('click', closeSettings);
setupBtn.addEventListener('click', openSettings);
saveKeyBtn.addEventListener('click', ()=>{
    const k=keyInput.value.trim();
    if(k){ S.apiKey=k; save(); updateUI(); closeSettings(); toast('API key tersimpan'); }
    else toast('Masukkan API key','error');
});
clearBtn.addEventListener('click', ()=>{
    S.msgs=[]; save(); renderAll(); closeSettings(); toast('Chat dihapus');
});
document.addEventListener('keydown', e=>{
    if(e.key==='Escape'&&!sSheet.classList.contains('hidden')) closeSettings();
});

/* Init */
load(); updateUI(); renderAll(); lucide.createIcons(); toBottom(true);
})();
</script>
